<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradient for the Crystalline Structure -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Cyan -->
    </linearGradient>
    
    <!-- Gradient for the Core ML/DL Node -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" /> <!-- Pink -->
      <stop offset="100%" stop-color="#9333EA" /> <!-- Purple -->
    </linearGradient>
  </defs>

  <!-- Outer Hexagon (Crystalline Boundary) -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" 
           fill="none" 
           stroke="url(#crystalGrad)" 
           stroke-width="4" 
           stroke-linejoin="round" />

  <!-- Internal 3D Structure (Faces: Structure, Microstructure, Texture) -->
  <!-- Center to Bottom -->
  <line x1="32" y1="32" x2="32" y2="60" stroke="url(#crystalGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Center to Top Right -->
  <line x1="32" y1="32" x2="56" y2="18" stroke="url(#crystalGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Center to Top Left -->
  <line x1="32" y1="32" x2="8" y2="18" stroke="url(#crystalGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Multi-Modal / Peripheral Data Nodes -->
  <circle cx="32" cy="4" r="3.5" fill="url(#crystalGrad)" />
  <circle cx="56" cy="18" r="3.5" fill="url(#crystalGrad)" />
  <circle cx="56" cy="46" r="3.5" fill="url(#crystalGrad)" />
  <circle cx="32" cy="60" r="3.5" fill="url(#crystalGrad)" />
  <circle cx="8" cy="46" r="3.5" fill="url(#crystalGrad)" />
  <circle cx="8" cy="18" r="3.5" fill="url(#crystalGrad)" />

  <!-- Core ML-DL Predictive Node -->
  <circle cx="32" cy="32" r="7" fill="url(#nodeGrad)" />
  
  <!-- Subtle inner core highlight -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" opacity="0.8" />
</svg>
